<!DOCTYPE html>
<html lang="es">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>Experiencia de RA - Modelo 3D</title>
    
    <!-- Librerías de A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- Opcional: descomenta la línea de abajo si tu archivo .glb tiene animaciones incluidas -->
    <!-- <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script> -->
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <!-- Precarga del modelo 3D -->
      <a-assets>
        <a-asset-item id="modelo-monstruos" src="./MONSTRUOS.glb"></a-asset-item>
      </a-assets>

      <!-- Iluminación básica para que el modelo 3D no se vea negro -->
      <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
      <a-light type="directional" color="#ffffff" intensity="2" position="1 2 3"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- targetIndex: 0 corresponde a la primera imagen procesada en targets.mind -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- Modelo 3D .glb -->
        <a-gltf-model 
          src="#modelo-monstruos" 
          position="0 0 0" 
          rotation="0 0 0" 
          scale="0.5 0.5 0.5">
          <!-- Si quieres que reproduzca animaciones del .glb, agrega animation-mixer dentro de esta etiqueta -->
        </a-gltf-model>

      </a-entity>
    </a-scene>
  </body>
</html>
