<!DOCTYPE html>
<html lang="es">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>Experiencia de RA - Modelo 3D Anclado</title>
    
    <!-- Librerías de A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>

    <!-- Script para centrar automáticamente el pivote del modelo 3D en el centro de la imagen -->
    <script>
      AFRAME.registerComponent('centrar-modelo', {
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;
            const box = new THREE.Box3().setFromObject(obj);
            const center = box.getCenter(new THREE.Vector3());
            // Mueve la geometría interna para que su centro coincida con (0,0,0) del marcador
            obj.position.sub(center);
          });
        }
      });
    </script>
  </head>
  <body>
    <!-- 
      Se ajustaron filterMinCF y filterBeta a valores estándar para eliminar el retraso ("arrastre") 
      y que el objeto responda al instante al movimiento del celular.
    -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5; warmupTolerance: 5;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <!-- Precarga del modelo 3D -->
      <a-assets>
        <a-asset-item id="modelo-monstruos" src="./MONSTRUOS.glb"></a-asset-item>
      </a-assets>

      <!-- Iluminación -->
      <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
      <a-light type="directional" color="#ffffff" intensity="2" position="1 2 3"></a-light>

      <!-- Cámara fija (MindAR controla la posición relativa del target respecto a esta cámara) -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Contenedor anclado a la imagen física -->
      <a-entity id="target-container" mindar-image-target="targetIndex: 0">
        
        <!-- Modelo 3D .glb con autocentrado -->
        <a-gltf-model 
          src="#modelo-monstruos" 
          centrar-modelo
          position="0 0 0.1" 
          rotation="0 0 0" 
          scale="0.3 0.3 0.3">
        </a-gltf-model>

      </a-entity>
    </a-scene>
  </body>
</html>
