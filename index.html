<!DOCTYPE html>
<html lang="es">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>Experiencia de RA - Monstruos saliendo de la imagen</title>
    
    <!-- Librerías de A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>

    <script>
      // 1. Ajusta automáticamente el tamaño y centra el modelo respecto a la imagen física
      AFRAME.registerComponent('ajustar-monstruos', {
        schema: {
          tamanoRelativo: { type: 'number', default: 0.8 } // 0.8 = 80% del ancho de la imagen
        },
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;

            // Medir la caja real del modelo .glb
            const box = new THREE.Box3().setFromObject(obj);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            // Calcular la dimensión más grande para normalizarlo a la escala del marcador
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
              const scaleFactor = this.data.tamanoRelativo / maxDim;
              obj.scale.setScalar(scaleFactor);
              
              // Recalcular el centro ya escalado para que quede anclado exactamente al punto
              obj.position.sub(center.multiplyScalar(scaleFactor));
            }
          });
        }
      });

      // 2. Asegura que el modelo solo sea visible mientras la imagen está anclada en el espacio
      AFRAME.registerComponent('control-visibilidad', {
        init: function () {
          const modelo = this.el.querySelector('#contenedor-monstruos');
          this.el.addEventListener('targetFound', () => {
            modelo.setAttribute('visible', true);
          });
          this.el.addEventListener('targetLost', () => {
            modelo.setAttribute('visible', false);
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 3;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <!-- Precarga del modelo 3D -->
      <a-assets>
        <a-asset-item id="modelo-monstruos" src="./MONSTRUOS.glb"></a-asset-item>
      </a-assets>

      <!-- Iluminación para dar volumen 3D -->
      <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
      <a-light type="directional" color="#ffffff" intensity="2.2" position="1 3 2"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Marcador anclado en el espacio -->
      <a-entity mindar-image-target="targetIndex: 0" control-visibilidad>
        
        <!-- 
          Contenedor posicionado en el espacio respecto a la imagen:
          - X = -0.35 -> Desplazado un poco a la izquierda de la imagen.
          - Y =  0.00 -> Centrado en altura (sube a 0.2 si quieres que flote más arriba).
          - Z =  0.25 -> Saliendo hacia afuera de la imagen (flotando frente al cuadro).
        -->
        <a-entity id="contenedor-monstruos" position="-0.35 0 0.25" visible="false">
          <a-gltf-model 
            src="#modelo-monstruos" 
            ajustar-monstruos="tamanoRelativo: 0.85"
            rotation="0 0 0">
          </a-gltf-model>
        </a-entity>

      </a-entity>
    </a-scene>
  </body>
</html>
